name: Release

on:
  push:
    branches: [main]
    tags:
      - "v*"
  workflow_dispatch:
    inputs:
      tag:
        description: "Release tag to create or update (for example, v1.0.0)"
        required: true
        type: string

permissions:
  contents: write

jobs:
  publish:
    if: github.ref_type == 'tag' || github.event_name == 'workflow_dispatch' || startsWith(github.event.head_commit.message, 'release:')
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - name: Resolve release tag
        id: release
        shell: bash
        run: |
          if [[ "${{ github.event_name }}" == "workflow_dispatch" ]]; then
            tag="${{ inputs.tag }}"
          elif [[ "${{ github.ref_type }}" == "tag" ]]; then
            tag="${{ github.ref_name }}"
          else
            tag="v$(node -p 'require(\"./package.json\").version')"
          fi
          echo "tag=$tag" >> "$GITHUB_OUTPUT"
      - run: npm ci --ignore-scripts
      - run: npm run check
      - name: Package load-unpacked extension
        env:
          RELEASE_TAG: ${{ steps.release.outputs.tag }}
        run: |
          mkdir -p dist
          git archive --format=zip --prefix=frameweave/ --output="dist/frameweave-${RELEASE_TAG}.zip" "$GITHUB_SHA"
          sha256sum "dist/frameweave-${RELEASE_TAG}.zip" > dist/SHA256SUMS.txt
      - name: Publish GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.release.outputs.tag }}
          target_commitish: ${{ github.sha }}
          generate_release_notes: true
          make_latest: true
          body: |
            ## Install

            Download `frameweave-${{ steps.release.outputs.tag }}.zip`, extract it, then use **Load unpacked** from `chrome://extensions` and select the extracted `frameweave` folder.

            Verify the ZIP against `SHA256SUMS.txt` before loading it.
          files: |
            dist/frameweave-${{ steps.release.outputs.tag }}.zip
            dist/SHA256SUMS.txt
